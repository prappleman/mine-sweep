<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mine Sweep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mine.css">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
        <h1 class="logo">MINE<span>SWEEP</span></h1>
        <button type="button" class="pilot" id="pilot-btn" title="Change initials">
            <span>PLAYER</span>
            <strong id="pilot-name">---</strong>
        </button>
    </header>

    <main class="layout">
        <section class="cabinet">
            <div class="hud">
                <div class="hud-item">
                    <span>Mines</span>
                    <strong id="mines-count">10</strong>
                </div>
                <div class="hud-item hud-timer">
                    <span>Time</span>
                    <strong id="timer">0:00.00</strong>
                </div>
                <div class="hud-item">
                    <span>Flags</span>
                    <strong id="flag-counter">10</strong>
                </div>
            </div>

            <div id="board" role="grid" aria-label="Minesweeper board"></div>

            <div class="controls">
                <p class="hint">Left click digs · Right click flags · Hold to flag on mobile</p>
                <button type="button" id="new-game">New Game</button>
            </div>
        </section>

        <aside class="scores-panel">
            <div class="scores-header">
                <h2>High Scores</h2>
                <p>Fastest clears</p>
            </div>
            <ol id="leaderboard" class="leaderboard"></ol>
        </aside>
    </main>

    <div id="name-modal" class="modal" hidden>
        <div class="modal-card">
            <p class="modal-kicker">Insert coin</p>
            <h2>Enter your name</h2>
            <p class="modal-copy">Three letters. Arcade rules.</p>
            <div class="initials" id="initials">
                <input id="letter-0" maxlength="1" autocomplete="off" aria-label="First letter">
                <input id="letter-1" maxlength="1" autocomplete="off" aria-label="Second letter">
                <input id="letter-2" maxlength="1" autocomplete="off" aria-label="Third letter">
            </div>
            <button type="button" class="primary" id="save-name">Let's play</button>
        </div>
    </div>

    <div id="result-modal" class="modal" hidden>
        <div class="modal-card">
            <p class="modal-kicker" id="result-kicker">Game over</p>
            <h2 id="result-title">Boom</h2>
            <p class="modal-copy" id="result-copy"></p>
            <button type="button" class="primary" id="play-again">Play again</button>
        </div>
    </div>

    <script src="js/mine.js"></script>
</body>
</html>
